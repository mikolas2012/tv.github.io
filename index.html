<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrum Pobierania Plików</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --primary: #007bb5;
            --primary-hover: #005f8d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin-top: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: #111;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .file-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .file-card:hover {
            transform: translateY(-2px);
        }

        .file-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-name {
            font-weight: 600;
            font-size: 16px;
        }

        .file-meta {
            font-size: 13px;
            color: var(--text-muted);
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-right: 5px;
        }

        .badge-apk { background: #e1f5fe; color: #0288d1; }
        .badge-zip { background: #efebe9; color: #5d4037; }
        .badge-other { background: #eaeaea; color: #444444; }

        .download-btn {
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 480px) {
            .file-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .download-btn {
                width: 100%;
                text-align: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Pobierz Pliki</h1>
        <p>Wybierz plik z listy poniżej, aby rozpocząć pobieranie.</p>
    </header>

    <div class="file-list">
        <!-- PLIK 1 (APK) -->
        <div class="file-card">
            <div class="file-info">
                <div class="file-name">Aplikacja Mobilna</div>
                <div class="file-meta">
                    <span class="badge badge-apk">APK</span> v1.0.2 • 24 MB
                </div>
            </div>
            <a href="pliki/aplikacja.apk" download class="download-btn">Pobierz</a>
        </div>

        <!-- PLIK 2 (ZIP) -->
        <div class="file-card">
            <div class="file-info">
                <div class="file-name">Paczka Dodatków</div>
                <div class="file-meta">
                    <span class="badge badge-zip">ZIP</span> Archiwum • 45 MB
                </div>
            </div>
            <a href="pliki/dodatki.zip" download class="download-btn">Pobierz</a>
        </div>
    </div>
</div>

</body>
</html>
